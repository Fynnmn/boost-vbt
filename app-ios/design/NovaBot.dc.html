      uA: url('gA'), uP: url('gP'), uV: url('gV'), uI: url('gI'), uG: url('fG'), uS: url('fS'),
      look: idle ? 'nbLook 7s ease-in-out infinite' : 'none',
      bob: listen ? 'nbBob .8s ease-in-out infinite' : 'none',
      plateL: listen ? 'nbPlate .7s ease-in-out infinite' : 'none', plateR: listen ? 'nbPlateR .7s ease-in-out infinite' : 'none',
      irisR: listen ? 10 : 8, irisDash: think ? '8 5' : 'none', irisSpin: think ? 'nbSpin 1.4s linear infinite' : 'none',
      pupR: listen ? 5.5 : think ? 3.2 : 4.4, blinkDron: idle ? 'nbBlink 5s infinite' : 'none',
      sparkle: think ? 'nbSpin 2s linear infinite' : 'nbTwinkle 2.6s ease-in-out infinite'
    };
  }
}
</script>
