; Firmware del sensor VBT
;
; Dos entornos a proposito:
;   xiaoblesense -> la placa real (Seeed XIAO nRF52840 Sense)
;   native       -> corre en la PC, para testear src/algo/ contra el dataset
;
; El entorno native es la mitad del plan: es lo que permite iterar el
; algoritmo en segundos en vez de ir al gimnasio. Por eso PlatformIO y no
; Arduino IDE, que no puede hacer esto.

[platformio]
default_envs = xiaoblesense
src_dir = src

[env]
build_flags =
    -Wall
    -Wextra
    -Isrc

; ---------------------------------------------------------------------------
; Placa real
; ---------------------------------------------------------------------------
[env:xiaoblesense]
platform = nordicnrf52
board = xiaoblesense
framework = arduino
build_flags =
    ${env.build_flags}
    -DVBT_TARGET_NRF52
; La XIAO viene con el bootloader de Adafruit de fabrica: se flashea por USB
; sin programador externo. Si no aparece el puerto, doble toque al boton de
; reset para entrar al bootloader.
upload_protocol = nrfutil
monitor_speed = 115200

; ---------------------------------------------------------------------------
; Build de PC: algoritmo aislado, sin hardware
; ---------------------------------------------------------------------------
; src/algo/ no incluye Arduino ni BLE ni drivers. Esa disciplina es lo que
; permite compilar el MISMO codigo aca y en el micro, y es lo que haria
; portable el proyecto si algun dia se migra a Zephyr.
[env:native]
platform = native
build_flags =
    ${env.build_flags}
    -std=gnu++17
    -DVBT_HOST_BUILD
    -g
build_src_filter = +<algo/>
test_framework = unity
test_dir = test/host
